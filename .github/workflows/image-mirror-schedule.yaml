---
name: image-mirror-schedule

on:
  schedule:
  # - cron: '15 */3 * * *' # 每3小时运行
  - cron: '0 */6 * * *' # 每6小时运行
  # - cron: '15 */4 * * *' # 每4小时运行

  workflow_dispatch: # 支持手动触发

env:
  TARGET_REGISTRY: crpi-kkccity66j9w1y3k.cn-hongkong.personal.cr.aliyuncs.com/wubmu

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrixList: ${{ steps.get-matrix.outputs.matrixList }}
      matrixEnable: ${{ steps.get-matrix.outputs.matrixEnable }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Calculate which config files to process this round
      id: get-matrix
      env:
        SYNC_MOD: 28  # 取模值，公式：周期天数 × 24 ÷ 间隔小时数
        SYNC_INTERVAL_HOURS: 6  # cron 触发间隔（小时），与 cron 频率保持一致
      run: |
          list=$(bash script.sh)
          arr=$(echo $list | jq -R 'split(" ")')
          value=$(jq -n --argjson arr "$arr" '{"target": $arr}')
          echo matrixList=$value >> $GITHUB_OUTPUT

          # GitHub Actions 的 if 条件不支持直接判断数组是否为空，用布尔值传递
          if [ "$arr" == "[]" ]; then
            echo matrixEnable=false >> $GITHUB_OUTPUT
          else
            echo matrixEnable=true >> $GITHUB_OUTPUT
          fi

          cat "$GITHUB_OUTPUT"

  sync:
    needs: setup
    if: ${{ needs.setup.outputs.matrixEnable == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrixList) }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Validate auth config secret
      run: |
        if [ -z "${{ secrets.IMAGESYNC_AUTH_CONFIG }}" ]; then
          echo "::error::IMAGESYNC_AUTH_CONFIG secret is not configured."
          echo "Please go to Settings → Secrets and variables → Actions → New repository secret"
          echo "Name:  IMAGESYNC_AUTH_CONFIG"
          echo "Value: your auth.yaml content"
          exit 1
        fi
    - name: Write auth config from secret
      run: echo '${{ secrets.IMAGESYNC_AUTH_CONFIG }}' > ./auth.yaml
    - name: Verify registry auth
      run: |
        echo "=== auth.yaml 结构（密码已隐藏）==="
        sed 's/\(password:\s*\).*/\1****/' ./auth.yaml
        echo ""
        echo "=== 测试 registry 认证 ==="
        python3 -c "
        import yaml, subprocess, sys
        with open('./auth.yaml') as f:
            auth = yaml.safe_load(f)
        if not auth:
            print('ERROR: auth.yaml 为空或格式错误')
            sys.exit(1)
        failed = []
        for registry, creds in auth.items():
            user = creds.get('username', '')
            pwd = creds.get('password', '')
            if not user or not pwd:
                print(f'WARN: {registry} 缺少 username 或 password')
                failed.append(registry)
                continue
            r = subprocess.run(
                ['docker', 'login', '--username', user, '--password-stdin', registry],
                input=pwd, capture_output=True, text=True
            )
            if r.returncode == 0:
                print(f'OK:   {registry} 认证成功')
            else:
                print(f'FAIL: {registry} 认证失败')
                print(f'      stderr: {r.stderr.strip()}')
                failed.append(registry)
        if failed:
            print(f'\n错误: {len(failed)} 个 registry 认证失败')
            sys.exit(1)
        else:
            print('\n所有 registry 认证通过')
        " 2>&1
    - name: Substitute target registry
      run: envsubst < ${{ matrix.target }} > /tmp/sync-target.yaml
    - name: Sync Images
      uses: hhyasdf/image-sync-action@v1.1
      with:
        auth_file: ./auth.yaml
        proc: 20
        images_file: /tmp/sync-target.yaml
