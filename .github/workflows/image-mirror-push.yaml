name: image-mirror-push

on:
  push:
    branches:
    - main

env:
  TARGET_REGISTRY: crpi-kkccity66j9w1y3k.cn-hongkong.personal.cr.aliyuncs.com/code

jobs:
  sync-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        images_file:
        - ./conf/redis.yaml
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Validate auth config secret
      run: |
        if [ -z "${{ secrets.IMAGESYNC_AUTH_CONFIG }}" ]; then
          echo "::error::IMAGESYNC_AUTH_CONFIG secret is not configured."
          echo "Please go to Settings → Secrets and variables → Actions → New repository secret"
          echo "Name:  IMAGESYNC_AUTH_CONFIG"
          echo "Value: your auth.yaml content"
          exit 1
        fi
    - name: Write auth config from secret
      run: echo '${{ secrets.IMAGESYNC_AUTH_CONFIG }}' > ./auth.yaml
    - name: Verify registry auth
      run: |
        echo "=== auth.yaml 结构（密码已隐藏）==="
        sed 's/\(password:\s*\).*/\1****/' ./auth.yaml
        echo ""
        echo "=== 测试 registry 认证 ==="
        python3 -c "
        import yaml, subprocess, sys
        with open('./auth.yaml') as f:
            auth = yaml.safe_load(f)
        if not auth:
            print('ERROR: auth.yaml 为空或格式错误')
            sys.exit(1)
        failed = []
        for registry, creds in auth.items():
            user = creds.get('username', '')
            pwd = creds.get('password', '')
            if not user or not pwd:
                print(f'WARN: {registry} 缺少 username 或 password')
                failed.append(registry)
                continue
            r = subprocess.run(
                ['docker', 'login', '--username', user, '--password-stdin', registry],
                input=pwd, capture_output=True, text=True
            )
            if r.returncode == 0:
                print(f'OK:   {registry} 认证成功')
            else:
                print(f'FAIL: {registry} 认证失败')
                print(f'      stderr: {r.stderr.strip()}')
                failed.append(registry)
        if failed:
            print(f'\n错误: {len(failed)} 个 registry 认证失败')
            sys.exit(1)
        else:
            print('\n所有 registry 认证通过')
        " 2>&1 || {
          echo ""
          echo "如果上面报 ModuleNotFoundError: No module named 'yaml'"
          echo "改用 awk 解析:"
          awk '/^[a-z]/{registry=$1; gsub(/:$/,"",registry)} /username:/{user=$2} /password:/{pass=$2} registry!="" && pass!=""{printf "docker login --username %s --password-stdin %s\n", user, registry; registry=""; user=""; pass=""}' ./auth.yaml
        }
    - name: Substitute target registry
      run: envsubst < ${{ matrix.images_file }} > /tmp/sync-target.yaml
    - name: Sync Images
      uses: hhyasdf/image-sync-action@v1.1
      with:
        auth_file: ./auth.yaml
        proc: 20
        images_file: /tmp/sync-target.yaml
